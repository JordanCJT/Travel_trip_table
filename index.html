<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中国行程表</title>
<meta name="description" content="家人一起的中国行程：时间表、地址和路线地图">
<meta property="og:title" content="中国行程表">
<meta property="og:description" content="时间表、地址和路线地图，点开就能看">
<meta name="color-scheme" content="light dark">
<style>
/* Layout concept: a rail-station timetable. Days are departure blocks, times sit in a mono column, the route map is a plain graticule with numbered stops. No external fonts or scripts, so it also loads where Google and CDNs are slow. */
:root{
  --bg:#F1F4F5; --surface:#FFFFFF; --ink:#14212B; --muted:#586873; --line:#D6DEE2;
  --accent:#0B7A6B; --accent-ink:#FFFFFF; --warn:#8F5A00; --warn-soft:#FBEFD6; --pin-ink:#FFFFFF; --grid:#E3E9EC;
  --d0:#0B7A6B; --d1:#C2410C; --d2:#2F5BD3; --d3:#A21CAF; --d4:#8A6D00; --d5:#C0264B; --d6:#586873;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F161B; --surface:#172028; --ink:#E6EDF1; --muted:#93A3AE; --line:#28353F;
    --accent:#3CC2AC; --accent-ink:#06241E; --warn:#E5A94A; --warn-soft:#33280F; --pin-ink:#0F161B; --grid:#1F2B33;
    --d0:#3CC2AC; --d1:#F08A5D; --d2:#7AA2FF; --d3:#D98AE8; --d4:#D6B84A; --d5:#F2708F; --d6:#9AA9B3;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 var(--font-body);
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1080px;margin:0 auto}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.top{margin-bottom:12px}
h1{margin:0;font-size:28px;font-weight:700;line-height:1.25;text-wrap:balance}
.stats{margin:2px 0 0;color:var(--muted);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:12px 0 14px}
.src{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 14px;margin-bottom:14px;font-size:14px}

.tabs{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:3px;gap:2px;margin-bottom:10px}
.tabs button{border:0;background:transparent;padding:6px 18px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.daynav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;margin-bottom:6px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.chip{flex:0 0 auto;min-width:58px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.chip .a{font-family:var(--font-mono);font-weight:600;font-size:15px}
.chip .b{font-size:11px;color:var(--muted);max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:13px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on .b{color:var(--bg);opacity:.75}
.chip.has .a::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dc,var(--accent));margin-left:5px;vertical-align:middle}
.chip.on.has .a::after{background:var(--bg)}

.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.day-h{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.day-n{font-family:var(--font-mono);font-weight:600;font-size:34px;line-height:1;color:var(--dc);display:flex;align-items:baseline;gap:3px}
.day-n small{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:400}
.day-meta{min-width:0;flex:1}
.day-date{font-weight:700}
.day-city{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.day-count{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.stops{list-style:none;margin:0;padding:6px 16px 10px}
.stop{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:4px 14px;padding:10px 0}
.stop+.stop{border-top:1px dashed var(--line)}
.t{font-family:var(--font-mono);font-size:15px;font-weight:600;padding-top:1px}
.t.none{color:var(--muted)}
.n{font-weight:700;overflow-wrap:anywhere}
.tag{display:inline-block;margin-left:8px;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;vertical-align:1px}
.addr{color:var(--muted);font-size:14px;overflow-wrap:anywhere;margin:0}
.note{margin:4px 0 0;font-size:14px;overflow-wrap:anywhere;padding-left:10px;border-left:2px solid var(--line)}
.go{display:flex;gap:10px;font-size:13px;align-items:flex-start;padding-top:3px}
.empty-day{margin:0;padding:14px 16px;color:var(--muted);font-size:14px}
@media (max-width:620px){
  .stop{grid-template-columns:62px minmax(0,1fr)}
  .go{grid-column:2}
  .day-n{font-size:28px}
}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.sm{padding:3px 10px;font-size:13px}

.mapgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.mapcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:820px){.mapcol{position:static}}
.mapbox{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.legend{margin:8px 2px 0;font-size:12px;color:var(--muted)}
.g-line{stroke:var(--grid);stroke-width:1}
.g-txt{fill:var(--muted);font-size:11px;font-family:var(--font-mono)}
.route{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;opacity:.65}
.pin{cursor:pointer}
.pin .halo{fill:transparent;stroke:transparent;stroke-width:2.5}
.pin.sel .halo{stroke:var(--ink)}
.pin .dot.approx{stroke:var(--pin-ink);stroke-width:2;stroke-dasharray:3 2.5}
.pn{fill:var(--pin-ink);font-size:13px;font-weight:700;text-anchor:middle;font-family:var(--font-mono)}
.pl{fill:var(--ink);font-size:13px;font-weight:500;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.scale{stroke:var(--ink);stroke-width:2;fill:none}
.scale-t{fill:var(--ink);font-size:11px;font-family:var(--font-mono);text-anchor:middle}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mi{background:var(--surface);border:1px solid var(--line);border-radius:9px}
.mi.sel{border-color:var(--ink)}
.mi-h{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 12px;cursor:pointer}
.badge{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--dc);color:var(--pin-ink);display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:13px}
.mi-t{min-width:0;flex:1}
.mi-n{font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.mi-m{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.detail{padding:0 12px 12px 48px;display:flex;flex-direction:column;gap:6px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.route-btn{margin-bottom:10px}
.msg{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px 18px;color:var(--muted)}
.msg strong{color:var(--ink)}


/* share text */
.topts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:10px;padding:12px 14px}
.topts label{display:flex;align-items:center;gap:6px;font-size:14px}
.topts input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 6px;text-align:center}
.tday{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.tday-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--dc)}
.tx{margin:0;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.75 var(--font-body)}
.hint{margin:0 0 10px;font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}

.toast{position:fixed;left:0;right:0;margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:9px;padding:9px 16px;font-size:14px;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;z-index:20}
.toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">中国行程表</h1>
    <p id="stats" class="stats">正在载入行程…</p>
  </header>
  <div class="bar">
    <label class="btn sm" for="file">载入我的表格</label>
    <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
    <a class="btn sm" href="itinerary.xlsx" download>下载表格</a>
    <span id="src" class="src"></span>
  </div>
  <div id="banner"></div>
  <div class="tabs" role="tablist" aria-label="视图">
    <button role="tab" data-view="plan" aria-selected="true">时间表</button>
    <button role="tab" data-view="map" aria-selected="false">地图</button>
    <button role="tab" data-view="text" aria-selected="false">分享文字</button>
  </div>
  <div id="daynav" class="daynav" aria-label="按天筛选"></div>
  <section id="v-plan"></section>
  <section id="v-map" hidden></section>
  <section id="v-text" hidden>
    <div class="panel topts">
      <label><input type="checkbox" id="oAddr" checked> 显示地址</label>
      <label><input type="checkbox" id="oNotes" checked> 显示备注</label>
      <label><input type="checkbox" id="oBold" checked> 标题加粗（WhatsApp）</label>
      <label>每天开头符号 <input type="text" id="oEmoji" value="📅" maxlength="4" style="width:3.4em" aria-label="每天开头符号"></label>
      <button class="btn primary" data-copyel="textAll">复制全部行程</button>
    </div>
    <p class="hint">用上面的按天筛选，可以只看某一天。点“复制”后，直接粘贴到 WhatsApp 群。</p>
    <div id="textOut"></div>
  </section>
  <div id="toast" class="toast" role="status"></div>
</div>

<script src="vendor/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var COLS=["day","time","type","name","city","address","notes","lat","lng"];
var TYPES=["景点","早餐","午餐","晚餐","住宿","交通","其他","标题"];
var TICON={"景点":"📍","早餐":"🍳","午餐":"🍜","晚餐":"🍽️","住宿":"🏠","交通":"🚄","其他":"▪️"};
var TDEF={"标题":"00:00","早餐":"07:00","午餐":"12:00","晚餐":"18:00","住宿":"23:50"};
function normType(v){ v=String(v||"").trim(); if(v==="当天标题")v="标题"; return TYPES.indexOf(v)>=0?v:""; }
function isTitle(s){ return s.type==="标题"; }
function notTitle(s){ return s.type!=="标题"; }
function typeIcon(s){ return s.type&&s.type!=="景点"&&TICON[s.type]?TICON[s.type]+" ":""; }

var HEAD={day:["天数","天","第几天","day","日程"],time:["时间","time","时刻","开始时间"],type:["类别","类型","category","type"],name:["地点","地点名称","名称","地方","景点","name","place"],city:["城市","city"],address:["地址","address","位置"],notes:["备注","notes","note","说明"],lat:["纬度","lat","latitude"],lng:["经度","lng","lon","long","longitude"]};

/* major Chinese cities: zh, lowercase pinyin/english, lng, lat (only used to estimate a pin when a row has no coordinates) */
var CITIES=[["北京","beijing",116.41,39.90],["上海","shanghai",121.47,31.23],["广州","guangzhou",113.26,23.13],["深圳","shenzhen",114.06,22.54],["成都","chengdu",104.07,30.57],["重庆","chongqing",106.55,29.56],["西安","xi'an",108.94,34.34],["西安","xian",108.94,34.34],["杭州","hangzhou",120.15,30.27],["南京","nanjing",118.80,32.06],["苏州","suzhou",120.62,31.30],["无锡","wuxi",120.31,31.49],["武汉","wuhan",114.31,30.59],["长沙","changsha",112.94,28.23],["桂林","guilin",110.29,25.27],["阳朔","yangshuo",110.49,24.78],["昆明","kunming",102.83,25.04],["丽江","lijiang",100.23,26.87],["大理","dali",100.27,25.61],["张家界","zhangjiajie",110.48,29.12],["哈尔滨","harbin",126.64,45.76],["青岛","qingdao",120.38,36.07],["厦门","xiamen",118.09,24.48],["贵阳","guiyang",106.63,26.65],["拉萨","lhasa",91.17,29.65],["乌鲁木齐","urumqi",87.62,43.83],["三亚","sanya",109.51,18.25],["海口","haikou",110.35,20.02],["郑州","zhengzhou",113.62,34.75],["洛阳","luoyang",112.45,34.62],["天津","tianjin",117.20,39.08],["沈阳","shenyang",123.43,41.80],["大连","dalian",121.62,38.91],["济南","jinan",117.00,36.65],["合肥","hefei",117.23,31.82],["福州","fuzhou",119.30,26.07],["南昌","nanchang",115.86,28.68],["黄山","huangshan",118.34,29.71],["兰州","lanzhou",103.83,36.06],["西宁","xining",101.78,36.62],["敦煌","dunhuang",94.66,40.14],["银川","yinchuan",106.23,38.49],["太原","taiyuan",112.55,37.87],["大同","datong",113.30,40.08],["平遥","pingyao",112.18,37.20],["香港","hong kong",114.17,22.32],["澳门","macau",113.54,22.20],["南宁","nanning",108.37,22.82],["珠海","zhuhai",113.58,22.27],["乐山","leshan",103.77,29.55],["九寨沟","jiuzhaigou",103.92,33.26]];

var stops=[], meta={}, loaded=false, failed=null;
var view="plan", dayFilter=null, selId=null;

/* ---------- helpers ---------- */
function num(v){ if(v===null||v===undefined||v==="")return null; var n=Number(v); return isFinite(n)?n:null; }
function dayOf(s){ var d=parseInt(s.day,10); return d>=1?d:1; }
function timeKey(t,type){ var m=/(\d{1,2})\s*[:：点时]\s*(\d{1,2})?/.exec(String(t||"")); if(!m)return TDEF[type]||"99:99"; return ("0"+m[1]).slice(-2)+":"+("0"+(m[2]||"0")).slice(-2); }
function sorted(){ return stops.slice().sort(function(a,b){ var ka=timeKey(a.time,a.type),kb=timeKey(b.time,b.type); return dayOf(a)-dayOf(b) || (ka<kb?-1:ka>kb?1:0) || a.ord-b.ord; }); }
function dc(d){ return "var(--d"+((d-1)%7)+")"; }
function maxDay(){ var m=14; stops.forEach(function(s){ m=Math.max(m,dayOf(s)); }); return m; }
function dateOf(d){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(meta.start||""); if(!m)return null; return new Date(+m[1],+m[2]-1,+m[3]+d-1); }
function dateLabel(d){ var t=dateOf(d); return t? (t.getMonth()+1)+"月"+t.getDate()+"日 周"+"日一二三四五六".charAt(t.getDay()) : ""; }
function shortDate(d){ var t=dateOf(d); return t? (t.getMonth()+1)+"/"+t.getDate() : ""; }
function cityPos(s){
  var f=[s.city,s.address,s.name];
  for(var i=0;i<f.length;i++){ var h=String(f[i]||"").toLowerCase(); if(!h)continue;
    for(var j=0;j<CITIES.length;j++){ if(h.indexOf(CITIES[j][0])>=0||h.indexOf(CITIES[j][1])>=0)return [CITIES[j][2],CITIES[j][3]]; } }
  return null;
}
function exactPos(s){ var la=num(s.lat), lo=num(s.lng); return (la!==null&&lo!==null&&Math.abs(la)<=90&&Math.abs(lo)<=180)?[lo,la]:null; }
function qtext(s){ return [s.name, s.address||s.city].filter(Boolean).join(" "); }
function gUrl(s){ var p=exactPos(s); return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p?p[1]+","+p[0]:qtext(s)); }
function aUrl(s){ return "https://uri.amap.com/search?keyword="+encodeURIComponent(qtext(s)); }
function bUrl(s){ return "https://map.baidu.com/search/"+encodeURIComponent(qtext(s)); }
var tt;
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove("on"); },3000); }

/* ---------- reading the spreadsheet ---------- */
function parseDelim(t,d){
  var rows=[],row=[],cur="",q=false;
  for(var i=0;i<t.length;i++){ var c=t.charAt(i);
    if(q){ if(c==='"'){ if(t.charAt(i+1)==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"'&&cur==="")q=true;
    else if(c===d){row.push(cur);cur="";}
    else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur="";}
    else if(c!=="\r")cur+=c; }
  row.push(cur); rows.push(row); return rows;
}
function rowsFromAOA(aoa){
  aoa=aoa.filter(function(r){ return r.some(function(c){return String(c).trim()!=="";}); });
  if(!aoa.length)return [];
  var map={}, hits=0;
  aoa[0].forEach(function(c,i){ var h=String(c).trim().toLowerCase().replace(/\s+/g,""); Object.keys(HEAD).forEach(function(f){ if(HEAD[f].indexOf(h)>=0&&map[f]===undefined){ map[f]=i; hits++; } }); });
  var body=aoa;
  if(hits>=2)body=aoa.slice(1); else { map={}; COLS.forEach(function(f,i){ map[f]=i; }); }
  var last=1, out=[];
  body.forEach(function(r,i){
    var g=function(f){ return map[f]===undefined?"":String(r[map[f]]==null?"":r[map[f]]).trim(); };
    var name=g("name"); if(!name)return;
    var dm=g("day").match(/\d+/); var day=dm?parseInt(dm[0],10):last; if(day<1)day=1; last=day;
    out.push({id:"s"+out.length,ord:out.length,day:day,time:g("time"),type:normType(g("type")),name:name,city:g("city"),address:g("address"),notes:g("notes"),lat:num(g("lat")),lng:num(g("lng"))});
  });
  return out;
}
function metaFromAOA(aoa){
  var m={};
  aoa.forEach(function(r){
    var k=String(r[0]||"").trim().toLowerCase(), v=String(r[1]==null?"":r[1]).trim();
    if(!v)return;
    if(k.indexOf("名称")>=0||k==="title"||k==="name")m.title=v;
    if(k.indexOf("出发")>=0||k==="start"){ var d=/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(v); if(d)m.start=d[1]+"-"+("0"+d[2]).slice(-2)+"-"+("0"+d[3]).slice(-2); }
  });
  return m;
}
function ingestXlsx(buf,label){
  var wb=XLSX.read(buf,{type:"array"});
  var first=wb.Sheets[wb.SheetNames[0]];
  var rows=rowsFromAOA(XLSX.utils.sheet_to_json(first,{header:1,raw:false,defval:""}));
  var setName=wb.SheetNames.filter(function(n){ return /设置|setting/i.test(n); })[0];
  meta=setName?metaFromAOA(XLSX.utils.sheet_to_json(wb.Sheets[setName],{header:1,raw:false,defval:""})):{};
  setData(rows,label);
}
function setData(rows,label){
  stops=rows; loaded=true; failed=null; selId=null; dayFilter=null;
  $("#src").textContent=label?("当前显示："+label):"";
  renderAll();
}
async function loadDefault(){
  try{
    if(!window.XLSX)throw new Error("lib");
    var r=await fetch("itinerary.xlsx?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("http "+r.status);
    ingestXlsx(await r.arrayBuffer(),"itinerary.xlsx");
  }catch(e){
    loaded=true; stops=[];
    failed=location.protocol==="file:"?"file":"fetch";
    renderAll();
  }
}
$("#file").addEventListener("change",async function(){
  var f=this.files&&this.files[0]; if(!f)return;
  try{
    if(/\.csv$/i.test(f.name)){
      var txt=new TextDecoder("utf-8").decode(await f.arrayBuffer()).replace(/^﻿/,"");
      meta={}; setData(rowsFromAOA(parseDelim(txt,txt.indexOf("\t")>=0?"\t":",")),f.name);
    } else {
      if(!window.XLSX)throw new Error("lib");
      ingestXlsx(await f.arrayBuffer(),f.name);
    }
    toast("已载入 "+f.name);
  }catch(e){ toast("没能读取这个文件，请确认是 .xlsx 或 .csv"); }
  this.value="";
});

/* ---------- render ---------- */
function renderChrome(){
  $("#title").textContent=meta.title||"中国行程表";
  document.title=meta.title||"中国行程表";
  var cities={}; stops.forEach(function(s){ if(s.city)cities[s.city]=1; });
  var used={}; stops.forEach(function(s){ used[dayOf(s)]=1; });
  var range="";
  if(dateOf(1)){ var a=dateOf(1), b=dateOf(maxDay()); range=(a.getMonth()+1)+"月"+a.getDate()+"日 – "+(b.getMonth()+1)+"月"+b.getDate()+"日 · "; }
  $("#stats").textContent=!loaded?"正在载入行程…":failed?"没能载入行程":
    range+"共 "+maxDay()+" 天 · "+stops.length+" 个地点 · "+Object.keys(cities).length+" 座城市";
  var b="";
  if(failed==="file")b='<div class="banner">直接双击打开时，浏览器不允许读取同一文件夹里的表格。请点上面的“载入我的表格”，选择 itinerary.xlsx。</div>';
  else if(failed==="fetch")b='<div class="banner">没能读取 itinerary.xlsx。请确认它和 index.html 在同一个位置，或点上面的“载入我的表格”手动选择。</div>';
  $("#banner").innerHTML=b;
  Array.prototype.forEach.call(document.querySelectorAll(".tabs button"),function(x){ x.setAttribute("aria-selected",x.dataset.view===view?"true":"false"); });
  $("#v-plan").hidden=view!=="plan"; $("#v-map").hidden=view!=="map"; $("#v-text").hidden=view!=="text";
}
function renderNav(){
  var by={}; sorted().forEach(function(s){ var d=dayOf(s); (by[d]=by[d]||[]).push(s); });
  var h='<button class="chip'+(dayFilter===null?" on":"")+'" data-day="0"><span class="a">全部</span><span class="b">&nbsp;</span></button>';
  for(var d=1;d<=maxDay();d++){
    var l=by[d]||[]; var lab=shortDate(d)||((l.filter(function(s){return s.city;})[0]||{}).city||"");
    h+='<button class="chip'+(dayFilter===d?" on":"")+(l.length?" has":"")+'" style="--dc:'+dc(d)+'" data-day="'+d+'" aria-label="第'+d+'天"><span class="a">'+d+'</span><span class="b">'+esc(lab)+'</span></button>';
  }
  $("#daynav").innerHTML=h;
}
function links(s){ return '<a href="'+esc(gUrl(s))+'" target="_blank" rel="noopener">Google</a><a href="'+esc(aUrl(s))+'" target="_blank" rel="noopener">高德</a>'; }
function emptyState(){
  if(!loaded)return '<div class="msg">正在载入行程…</div>';
  if(failed)return '<div class="msg"><strong>还没有载入行程。</strong><br>点上面的“载入我的表格”选择 itinerary.xlsx。</div>';
  return '<div class="msg"><strong>表格里还没有行程。</strong><br>在 itinerary.xlsx 里填好“地点”这一列，再重新打开。</div>';
}
function renderPlan(){
  var el=$("#v-plan");
  if(!loaded||!stops.length){ el.innerHTML=emptyState(); return; }
  var list=sorted(), by={};
  list.forEach(function(s){ var d=dayOf(s); (by[d]=by[d]||[]).push(s); });
  var days=[]; if(dayFilter)days=[dayFilter]; else for(var d=1;d<=maxDay();d++)days.push(d);
  el.innerHTML=days.map(function(d){
    var all=by[d]||[]; var tr=all.filter(isTitle)[0]; var l=all.filter(notTitle); var cs=[]; l.forEach(function(s){ if(s.city&&cs.indexOf(s.city)<0)cs.push(s.city); });
    var head='<div class="day-h"><div class="day-n"><small>第</small>'+d+'<small>天</small></div><div class="day-meta"><div class="day-date">'+esc(dateLabel(d)||"第"+d+"天")+'</div><div class="day-city">'+esc((tr?tr.name:cs.join(" → "))||"　")+'</div></div><div class="day-count">'+(l.length?l.length+" 站":"")+'</div></div>';
    var body=l.length?'<ol class="stops">'+l.map(function(s){
      return '<li class="stop"><div class="t'+(s.time?"":" none")+'">'+esc(s.time||"—")+'</div><div><div class="n">'+typeIcon(s)+esc(s.name)+(s.city?'<span class="tag">'+esc(s.city)+'</span>':'')+'</div>'+
        (s.address?'<p class="addr">'+esc(s.address)+'</p>':'')+(s.notes?'<p class="note">'+esc(s.notes)+'</p>':'')+'</div><div class="go">'+links(s)+'</div></li>';
    }).join("")+'</ol>':'<p class="empty-day">这一天还没有安排。</p>';
    return '<section class="day" style="--dc:'+dc(d)+'">'+head+body+'</section>';
  }).join("");
}

function niceStep(span){ var st=[0.05,0.1,0.2,0.5,1,2,5,10,20]; for(var i=0;i<st.length;i++){ if(st[i]>=span/5)return st[i]; } return 20; }
function fmtDeg(v,step){ var dec=step<0.1?2:step<1?1:0; return v.toFixed(dec); }
function buildMap(list){
  var W=800,H=560,M=64, raw=[];
  list.forEach(function(s){ var p=exactPos(s); if(p)raw.push({s:s,lng:p[0],lat:p[1],approx:false}); else { var c=cityPos(s); if(c)raw.push({s:s,lng:c[0],lat:c[1],approx:true,key:c.join()}); } });
  if(!raw.length)return {svg:"",placed:0};
  var minLo=1e9,maxLo=-1e9,minLa=1e9,maxLa=-1e9;
  raw.forEach(function(r){ minLo=Math.min(minLo,r.lng);maxLo=Math.max(maxLo,r.lng);minLa=Math.min(minLa,r.lat);maxLa=Math.max(maxLa,r.lat); });
  var cLo=(minLo+maxLo)/2,cLa=(minLa+maxLa)/2,k=Math.cos(cLa*Math.PI/180);
  var spLo=Math.max(maxLo-minLo,0.5),spLa=Math.max(maxLa-minLa,0.4);
  var sc=Math.min((W-2*M)/(spLo*k),(H-2*M)/spLa);
  var X=function(lo){return W/2+(lo-cLo)*k*sc;}, Y=function(la){return H/2-(la-cLa)*sc;};
  var vLo=(W/2)/(k*sc), vLa=(H/2)/sc, g="";
  var sx=niceStep(vLo*2), sy=niceStep(vLa*2);
  for(var i=Math.ceil((cLo-vLo)/sx);i*sx<=cLo+vLo;i++){ var lo=i*sx,x=X(lo); g+='<line class="g-line" x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'"/><text class="g-txt" x="'+(x+4)+'" y="'+(H-8)+'">'+fmtDeg(lo,sx)+'°E</text>'; }
  for(var j=Math.ceil((cLa-vLa)/sy);j*sy<=cLa+vLa;j++){ var la=j*sy,y=Y(la); g+='<line class="g-line" x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'"/><text class="g-txt" x="6" y="'+(y-4)+'">'+fmtDeg(la,sy)+'°N</text>'; }
  var groups={}; raw.forEach(function(r){ r.x=X(r.lng); r.y=Y(r.lat); if(r.approx)(groups[r.key]=groups[r.key]||[]).push(r); });
  Object.keys(groups).forEach(function(key){ var a=groups[key]; if(a.length<2)return; a.forEach(function(r,i){ var ang=2*Math.PI*i/a.length-Math.PI/2; r.x+=Math.cos(ang)*22; r.y+=Math.sin(ang)*22; }); });
  var byDay={}; raw.forEach(function(r){ var d=dayOf(r.s); (byDay[d]=byDay[d]||[]).push(r); });
  var routes=Object.keys(byDay).map(function(d){ var a=byDay[d]; if(a.length<2)return ""; return '<polyline class="route" style="stroke:'+dc(+d)+'" points="'+a.map(function(r){return r.x.toFixed(1)+","+r.y.toFixed(1);}).join(" ")+'"/>'; }).join("");
  var order={}; raw.forEach(function(r){ var d=dayOf(r.s); order[d]=(order[d]||0)+1; r.n=order[d]; });
  var showAll=raw.length<=10;
  var pins=raw.slice().sort(function(a,b){ return (a.s.id===selId)-(b.s.id===selId); }).map(function(r){
    var d=dayOf(r.s), sel=r.s.id===selId, left=r.x>W*0.62, nm=String(r.s.name||"");
    var label=(showAll||sel)?'<text class="pl" x="'+(left?-19:19)+'" y="4.5" text-anchor="'+(left?"end":"start")+'">'+esc(nm.length>12?nm.slice(0,12)+"…":nm)+'</text>':"";
    return '<g class="pin'+(sel?" sel":"")+'" data-id="'+esc(r.s.id)+'" transform="translate('+r.x.toFixed(1)+' '+r.y.toFixed(1)+')" tabindex="0" role="button" aria-label="'+esc("第"+d+"天 第"+r.n+"站 "+nm)+'"><circle class="halo" r="19"/><circle class="dot'+(r.approx?" approx":"")+'" r="13" style="fill:'+dc(d)+'"/><text class="pn" y="4.5">'+r.n+'</text>'+label+'</g>';
  }).join("");
  var pxKm=sc/111, target=140/pxKm, nice=[1,2,5,10,20,50,100,200,500,1000,2000], km=nice[0];
  nice.forEach(function(n){ if(n<=target)km=n; });
  var bw=km*pxKm, bx=W-24-bw, by0=H-34;
  var scale='<path class="scale" d="M'+bx+' '+(by0-6)+' V'+by0+' H'+(bx+bw)+' V'+(by0-6)+'"/><text class="scale-t" x="'+(bx+bw/2)+'" y="'+(by0+15)+'">'+km+' 公里</text>';
  return {placed:raw.length, svg:'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="行程路线示意图">'+g+routes+pins+scale+'</svg>'};
}
function dayRouteUrl(list){
  var q=list.map(function(s){ var p=exactPos(s); return p?p[1]+","+p[0]:qtext(s); });
  var u="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(q[0])+"&destination="+encodeURIComponent(q[q.length-1]);
  if(q.length>2)u+="&waypoints="+encodeURIComponent(q.slice(1,-1).join("|"));
  return u+"&travelmode=transit";
}
function detailHTML(s){
  var addr=s.address||"";
  return '<div class="detail">'+(addr?'<p class="addr">'+esc(addr)+'</p>':'')+(s.notes?'<p class="note">'+esc(s.notes)+'</p>':'')+
    '<div class="btnrow"><a class="btn sm" target="_blank" rel="noopener" href="'+esc(gUrl(s))+'">Google 地图</a><a class="btn sm" target="_blank" rel="noopener" href="'+esc(aUrl(s))+'">高德地图</a><a class="btn sm" target="_blank" rel="noopener" href="'+esc(bUrl(s))+'">百度地图</a><button class="btn sm" data-copy="'+esc(addr||qtext(s))+'">复制地址</button></div></div>';
}
function renderMap(){
  var el=$("#v-map");
  if(!loaded||!stops.length){ el.innerHTML=emptyState(); return; }
  var l0=sorted().filter(notTitle), list=dayFilter?l0.filter(function(s){return dayOf(s)===dayFilter;}):l0;
  if(!list.length){ el.innerHTML='<div class="msg"><strong>这一天还没有地点。</strong></div>'; return; }
  var m=buildMap(list), order={};
  var items=list.map(function(s){
    var d=dayOf(s); order[d]=(order[d]||0)+1; var sel=s.id===selId, placed=!!(exactPos(s)||cityPos(s));
    return '<li class="mi'+(sel?" sel":"")+'" style="--dc:'+dc(d)+'"><button class="mi-h" data-pick="'+esc(s.id)+'" aria-expanded="'+sel+'"><span class="badge">'+order[d]+'</span><span class="mi-t"><div class="mi-n">'+esc(s.name)+'</div><div class="mi-m">第'+d+'天'+(s.time?' · '+esc(s.time):'')+(s.city?' · '+esc(s.city):'')+(placed?'':' · 未上图')+'</div></span></button>'+(sel?detailHTML(s):'')+'</li>';
  }).join("");
  var route=(dayFilter&&list.length>1)?'<a class="btn route-btn" target="_blank" rel="noopener" href="'+esc(dayRouteUrl(list))+'">用 Google 地图查看当天路线</a>':'';
  var miss=list.length-m.placed;
  el.innerHTML='<div class="mapgrid"><div class="mapcol">'+(m.svg?'<figure class="mapbox">'+m.svg+'</figure><p class="legend">示意图，没有底图。数字是当天的游览顺序，虚线圈是按城市估算的位置。'+(miss?' 有 '+miss+' 个地点缺少城市和经纬度，没有画出来。':'')+'</p>':'<div class="msg"><strong>地图上还没有点。</strong><br>在表格里给地点填上城市，或填上纬度和经度。</div>')+'</div><div class="listcol">'+route+'<ol class="mlist">'+items+'</ol></div></div>';
}
function renderAll(){ renderChrome(); renderNav(); if(view==="plan")renderPlan(); else if(view==="text")renderText(); else renderMap(); }


/* ---------- share text (for WhatsApp) ---------- */
function dayText(list,d,o){
  var tr=list.filter(isTitle)[0], items=list.filter(notTitle);
  if(!items.length&&!tr)return "";
  var date=dateLabel(d);
  var title=tr?tr.name:items.filter(function(s){return !s.type||s.type==="景点";}).map(function(s){return s.name;}).filter(Boolean).join("-");
  var h=(o.emoji||"")+"Day"+d+(date?" "+date:"")+(title?"｜"+title:"");
  var out=[o.bold?"*"+h+"*":h];
  if(tr&&tr.notes)out.push(tr.notes);
  items.forEach(function(s){
    var t=s.type||"景点", nm=s.name||"（未命名）", line;
    if(t==="早餐"||t==="午餐"||t==="晚餐")line=TICON[t]+" "+t+"："+nm+(s.time?"（"+s.time+"）":"");
    else if(t==="住宿")line="🏠 住宿："+nm;
    else line=(s.time?s.time+" ":"")+(t==="景点"?"":TICON[t]+" ")+nm;
    out.push(line);
    if(o.addr&&s.address)out.push("　📍 "+s.address);
    if(o.notes&&s.notes)out.push("　"+s.notes);
  });
  return out.join("\n");
}
function textOpts(){ return {addr:$("#oAddr").checked,notes:$("#oNotes").checked,bold:$("#oBold").checked,emoji:$("#oEmoji").value}; }
function renderText(){
  var el=$("#textOut");
  if(!loaded||!stops.length){ el.innerHTML=emptyState(); return; }
  var o=textOpts(), by={};
  sorted().forEach(function(s){ var d=dayOf(s); (by[d]=by[d]||[]).push(s); });
  var days=[]; if(dayFilter)days=[dayFilter]; else for(var d=1;d<=maxDay();d++)days.push(d);
  var blocks=[]; days.forEach(function(d){ var t=dayText(by[d]||[],d,o); if(t)blocks.push({d:d,t:t}); });
  if(!blocks.length){ el.innerHTML='<div class="msg"><strong>这一天还没有安排。</strong></div>'; return; }
  el.innerHTML='<pre id="textAll" hidden>'+esc(blocks.map(function(b){return b.t;}).join("\n\n"))+'</pre>'+
    blocks.map(function(b){ return '<div class="tday" style="--dc:'+dc(b.d)+'"><div class="tday-h"><strong>第'+b.d+'天</strong><button class="btn sm" data-copyel="tx'+b.d+'">复制这一天</button></div><pre id="tx'+b.d+'" class="tx">'+esc(b.t)+'</pre></div>'; }).join("");
}
function copyText(txt){
  var done=function(){ toast("已复制，可以粘贴到 WhatsApp 了"); };
  var fb=function(){ var a=document.createElement("textarea"); a.value=txt; a.style.position="fixed"; a.style.opacity="0"; document.body.appendChild(a); a.select(); var ok=false; try{ ok=document.execCommand("copy"); }catch(x){} a.remove(); if(ok)done(); else toast("复制没有成功，请长按文字手动复制"); };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(fb); else fb();
}
function loadTextOpts(){ try{ var o=JSON.parse(localStorage.getItem("textOpts")||"null"); if(o){ $("#oAddr").checked=!!o.addr; $("#oNotes").checked=!!o.notes; $("#oBold").checked=!!o.bold; if(o.emoji!=null)$("#oEmoji").value=o.emoji; } }catch(e){} }
["#oAddr","#oNotes","#oBold","#oEmoji"].forEach(function(s){ $(s).addEventListener("input",function(){ try{ localStorage.setItem("textOpts",JSON.stringify(textOpts())); }catch(e){} if(view==="text")renderText(); }); });
document.addEventListener("click",function(e){ var t=e.target.closest("[data-copyel]"); if(!t)return; var el=document.getElementById(t.dataset.copyel); if(el)copyText(el.textContent); else toast("没有可以复制的内容"); });
loadTextOpts();

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-view],[data-day],[data-pick],[data-copy],.pin");
  if(!t)return;
  if(t.dataset.view){ view=t.dataset.view; renderAll(); return; }
  if(t.dataset.day!==undefined){ var d=parseInt(t.dataset.day,10); dayFilter=d>0?d:null; selId=null; renderAll(); return; }
  if(t.dataset.pick){ selId=selId===t.dataset.pick?null:t.dataset.pick; renderAll(); return; }
  if(t.classList&&t.classList.contains("pin")){ selId=t.dataset.id; renderAll(); var li=document.querySelector('[data-pick="'+selId+'"]'); if(li&&li.scrollIntoView)li.scrollIntoView({block:"nearest"}); return; }
  if(t.dataset.copy!==undefined){
    var txt=t.dataset.copy, done=function(){ toast("已复制"); };
    var fb=function(){ var a=document.createElement("textarea"); a.value=txt; a.style.position="fixed"; a.style.opacity="0"; document.body.appendChild(a); a.select(); var ok=false; try{ ok=document.execCommand("copy"); }catch(x){} a.remove(); if(ok)done(); else toast("复制没有成功，请长按地址手动复制"); };
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(fb); else fb();
  }
});
document.addEventListener("keydown",function(e){ if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("pin")){ e.preventDefault(); selId=e.target.dataset.id; renderAll(); } });

renderAll();
loadDefault();
})();
</script>
